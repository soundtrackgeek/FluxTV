[package]
name = "fluxtv-core"
version.workspace = true
edition.workspace = true

[dependencies]
flate2 = "1.1.10"
futures-util = "0.3.34"
log = "0.4.34"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "stream", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
unicode-normalization = "0.1.25"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
